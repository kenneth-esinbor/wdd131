<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Review - Local Coffee Shop & Café Guide</title>
    <meta name="description" content="Submit a review or feedback for your favorite local coffee shop using our interactive form with local storage support.">
    <meta name="author" content="Kenneth Esinbor">
    <link rel="stylesheet" href="styles/styles.css">
    <script src="scripts/script.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="logo-area">
            <h1>Local Coffee Guide</h1>
        </div>
        <button id="menu-toggle" aria-label="Toggle Navigation">&#9776;</button>
        <nav id="nav-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="cafes.html">Cafés</a></li>
                <li><a href="contact.html" class="active">Contact & Review</a></li>
            </ul>
        </nav>
    </header>

    <main class="container form-main">
        <section class="form-wrapper">
            <h2>Café Review & Feedback Form</h2>
            <form id="review-form" class="styled-form">
                
                <div class="field">
                    <label for="cafeName">Select Café <span class="required">*</span></label>
                    <select id="cafeName" name="cafeName" required>
                        <option value="" disabled selected>Select a Café ...</option>
                    </select>
                </div>

                <div class="field">
                    <label for="rating">Overall Rating <span class="required">*</span></label>
                    <select id="rating" name="rating" required>
                        <option value="" disabled selected>Choose rating...</option>
                        <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                        <option value="4">⭐⭐⭐⭐ (4/5)</option>
                        <option value="3">⭐⭐⭐ (3/5)</option>
                        <option value="2">⭐⭐ (2/5)</option>
                        <option value="1">⭐ (1/5)</option>
                    </select>
                </div>

                <div class="field">
                    <label for="visitDate">Date of Visit <span class="required">*</span></label>
                    <input type="date" id="visitDate" name="visitDate" required>
                </div>

                <div class="field">
                    <label for="reviewerName">Your Name <span class="optional">(Optional)</span></label>
                    <input type="text" id="reviewerName" name="reviewerName" placeholder="Enter your name">
                </div>

                <div class="field">
                    <label for="reviewComments">Your Review / Comments <span class="required">*</span></label>
                    <textarea id="reviewComments" name="reviewComments" rows="4" placeholder="Tell us about your experience..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit Review</button>
            </form>

            <div id="submission-message" class="hidden-msg">
                <h3>Thank you for your review!</h3>
                <p>Your feedback has been successfully recorded using local storage.</p>
                <p>Total reviews submitted this session: <span id="review-counter">0</span></p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> | Kenneth Esinbor | Port Harcourt</p>
        <p><a href="references.html">References & Attributions</a></p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
